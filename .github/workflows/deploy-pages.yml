name: Deploy Google-connected pantry to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'themes.css'
      - 'fridge.css'
      - 'pantry.css'
      - 'theme.js'
      - 'js/**'
      - 'assets/**'
      - 'scripts/build-site.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.GOOGLE_SCRIPT_URL != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build shared production site
        run: node scripts/build-site.mjs
        env:
          DATA_PROVIDER: google
          GOOGLE_SCRIPT_URL: ${{ vars.GOOGLE_SCRIPT_URL }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload production files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
